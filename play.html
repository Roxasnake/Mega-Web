<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mega-Web Player</title>


<style>

html, body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;

    touch-action: none;

}


/* Zone de jeu */

#game {

    width: 100vw;

    height: 100vh;

}



/* Rendu pixels Mega Drive */

canvas {

    image-rendering: pixelated;

    image-rendering: crisp-edges;

}



/* Cache les éléments inutiles */

.ejs_menu,
.ejs_settings,
.ejs_controls,
.ejs_start_button,
.ejs_loader {

    display: none !important;

}



/* Force l'affichage des contrôles virtuels */

.ejs_virtual_gamepad {

    display: flex !important;

    position: fixed;

    bottom: 15px;

    left: 0;

    width: 100%;

    justify-content: center;

    z-index: 99999;

}



/* Taille boutons tactiles */

.ejs_virtual_gamepad button {

    width: 65px;

    height: 65px;

    margin: 6px;

    font-size: 25px;

}



</style>


</head>


<body>


<div id="game"></div>



<script>


// Récupération du chemin ROM

const params =
    new URLSearchParams(
        window.location.search
    );


const romPath =
    params.get("rom");



// Configuration EmulatorJS


var EJS_player = "#game";



var EJS_core = "genesis_plus_gx";



var EJS_pathtodata =
"https://cdn.emulatorjs.org/stable/data/";



var EJS_gameUrl = romPath;



// Démarrage automatique

var EJS_startOnLoaded = true;



// Active le tactile

var EJS_virtualGamepad = true;



// Evite certaines demandes inutiles

var EJS_disableDatabases = true;



// Cache certains écrans intermédiaires

var EJS_startButton = false;



</script>



<!-- Chargement émulateur -->

<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>



</body>

</html>
