<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mega-Web Player</title>


<style>

html, body {

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    background:#000;

    overflow:hidden;

    touch-action:none;

}


#game {

    width:100%;
    height:100%;

    display:flex;

    justify-content:center;

    align-items:center;

}


/* rendu pixels rétro */

canvas {

    image-rendering:pixelated;

    image-rendering:crisp-edges;

}


/* cacher les menus inutiles */

.ejs_menu,
.ejs_settings {

    display:none !important;

}


</style>


</head>


<body>


<div id="game"></div>



<script>


const params =
new URLSearchParams(
    window.location.search
);


const romPath =
params.get("rom");



// =======================
// Configuration EmulatorJS
// =======================


var EJS_player = "#game";


// Core léger Mega Drive

var EJS_core = "picodrive";



var EJS_pathtodata =
"https://cdn.emulatorjs.org/stable/data/";



var EJS_gameUrl = romPath;



// Démarrage automatique

var EJS_startOnLoaded = true;



// Optimisations

var EJS_threads = false;


var EJS_disableDatabases = true;



// Pas de shader gourmand

var EJS_shader = "none";



// Volume normal

var EJS_volume = 1;



</script>



<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>


</body>

</html>
