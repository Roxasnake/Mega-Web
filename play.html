<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mega-Web Player</title>


<style>

html, body {

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    background:#000;

    overflow:hidden;

}


#game {

    width:100vw;

    height:100vh;

}



/* Centrage de l'affichage */

#game > * {

    max-width:100vw !important;

    max-height:100vh !important;

}



/* Pixel art propre */

canvas {

    image-rendering: pixelated;

}



/* cacher éléments inutiles */

.ejs_menu,
.ejs_settings {

    display:none !important;

}


</style>


</head>


<body>


<div id="game"></div>



<script>


const params =
new URLSearchParams(
    window.location.search
);


const romPath =
params.get("rom");



var EJS_player = "#game";


// moteur léger

var EJS_core = "picodrive";



var EJS_pathtodata =
"https://cdn.emulatorjs.org/stable/data/";



var EJS_gameUrl = romPath;



// démarrage automatique

var EJS_startOnLoaded = true;



// garde le son actif

var EJS_volume = 1;



// désactive uniquement les sauvegardes en ligne

var EJS_disableDatabases = true;



</script>



<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>


</body>

</html>
