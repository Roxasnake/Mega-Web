<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mega-Web Player</title>


<style>

html, body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;

    touch-action: none;

}


/* Conteneur jeu */

#game {

    width: 100vw;

    height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

}



/* Canvas optimisé TV */

canvas {

    width: 960px !important;

    height: 672px !important;

    max-width: 100vw;

    max-height: 100vh;

    image-rendering: pixelated;

    image-rendering: crisp-edges;

}



/* Cache éléments inutiles */

.ejs_menu,
.ejs_settings,
.ejs_controls,
.ejs_start_button,
.ejs_loader {

    display:none !important;

}


</style>


</head>


<body>


<div id="game"></div>



<script>


const params =
    new URLSearchParams(
        window.location.search
    );


const romPath =
    params.get("rom");



// Configuration EmulatorJS


var EJS_player = "#game";



// Core plus léger

var EJS_core = "picodrive";



var EJS_pathtodata =
"https://cdn.emulatorjs.org/stable/data/";



var EJS_gameUrl = romPath;



// Démarrage automatique

var EJS_startOnLoaded = true;



// Désactive options lourdes

var EJS_disableDatabases = true;



// Evite certains ralentissements

var EJS_threads = false;



// Désactive shaders

var EJS_shader = "";



</script>



<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>



</body>

</html>
