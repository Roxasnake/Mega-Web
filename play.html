<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mega-Web Player</title>


<style>

html, body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: black;

    overflow: hidden;

}


#game {

    width: 100vw;
    height: 100vh;

}



/* Garder le rendu rétro */

canvas {

    image-rendering: pixelated;

    image-rendering: crisp-edges;

}



/* Cacher les menus inutiles */

.ejs_menu,
.ejs_settings,
.ejs_controls {

    display: none !important;

}



</style>


</head>


<body>


<div id="game"></div>



<script>


// Récupération du jeu choisi depuis le menu

const params =
    new URLSearchParams(
        window.location.search
    );


const romPath =
    params.get("rom");



// Configuration EmulatorJS

var EJS_player = "#game";


var EJS_core = "genesis_plus_gx";


var EJS_pathtodata =
"https://cdn.emulatorjs.org/stable/data/";



var EJS_gameUrl = romPath;



// Démarrage automatique

var EJS_startOnLoaded = true;



// Désactive certaines fonctions inutiles

var EJS_disableDatabases = true;



</script>



<!-- Chargement EmulatorJS -->

<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>



</body>

</html>
